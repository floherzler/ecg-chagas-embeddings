trainer:
  callbacks:
    - class_path: ecg_chagas_embeddings.callbacks.rolling_mean_metric.RollingMeanMetric
      init_args:
        source: emb_CAC_mean
        target: emb_CAC_mean3
        k: 3
        missing_value: 0.0
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: emb_CAC_mean3
        mode: max
        dirpath: /tmp/ckpts
        filename: best_ep_{epoch}_embCACm3_{emb_CAC_mean3:.3f}
        save_top_k: 1
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: emb_CAC_mean3
        mode: max
        patience: 10
        strict: true

model:
  track: 2
  use_sup_con: false
  use_prototypes: true
  # This still wires up SupConLoss internally; keep the baseline setting explicit.
  ratio_supervised_majority: 0.0
  init_classifier_bias: false
  classifier_bias_pos_fraction: null
