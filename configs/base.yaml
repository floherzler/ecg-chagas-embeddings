seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 100
  precision: bf16-mixed
  benchmark: true
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  log_every_n_steps: 100
  enable_model_summary: true
  enable_progress_bar: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: ecg-chagas-embeddings-cli
      entity: ag-lukassen
      save_dir: /tmp/wandb
      log_model: all           # upload best + last checkpoints

model:
  block: basic
  layers: [2, 2, 2, 2]
  inplanes: 64
  num_classes: 1
  zero_init_residual: false
  groups: 1
  width_per_group: 64
  norm_type: batch
  norm_groups: 8
  channels: 12
  initial_kernel_size: 7
  initial_stride: 2
  initial_padding: 3
  dropout_rate: 0.1
  se_reduction: null          # null disables squeeze-excite blocks
  stochastic_depth_prob: 0.0
  lr: 0.0005
  lr_scheduler: one_cycle     # options: none, one_cycle, cosine, step
  one_cycle_pct_start: 0.3
  one_cycle_div_factor: 25.0
  final_div_factor: 10000.0
  step_size: 10
  step_gamma: 0.1
  optimizer: adamw
  momentum: 0.9
  optimizer_betas: [0.9, 0.999]
  optimizer_eps: 1.0e-08
  classifier_weight_decay: 1.0e-05
  params_weight_decay: 1.0e-05
  # Track-specific toggles (set in configs/track*.yaml)
  # track: 1|2|3
  # use_sup_con / use_prototypes
  # init_classifier_bias / classifier_bias_pos_fraction
  use_sup_con: false
  use_prototypes: false
  ratio_supervised_majority: 0.0
  sup_con_temp: 0.07
  pretrained_encoder_path: null
  freeze_encoder: false
  unfreeze_last_block: false
  criterion:
    # class_path: ecg_chagas_embeddings.models.losses.BCEWithLogitsLossModule
    # init_args:
    #   pos_weight: 1.0
    class_path: ecg_chagas_embeddings.models.losses.FocalLoss
    init_args:
      alpha: 0.75
      gamma: 2.0

data:
  meta_path: /home/flo178/projects/master-thesis/datasets/physionet2025/processedMaster/metadata.csv
  data_dir: /home/flo178/projects/master-thesis/datasets/physionet2025/processedMaster/bp_sc
  batch_size: 256
  # Throughput defaults for A100 nodes with ample CPU/RAM.
  num_workers: 8
  prefetch_factor: 8
  worker_torch_threads: 1
  torch_load_weights_only: true
  torch_load_mmap: true
  train_in_order: false
  pos_fraction: 0.05
  oversample: false
  train_folds: [0,1,2]
  valid_folds: [3]
  neg_weight_code15: 1.0
  neg_weight_ptb_xl: 1.0
  neg_weight_sami_trop: 1.0
  pos_weight_code15: 1.0
  pos_weight_ptb_xl: 1.0
  pos_weight_sami_trop: 1.0
  crop_size: 2500
  # --- Mild default augmentations (shared across tracks unless overridden) ---
  # Enable axis rotation only when training from *bp* (linear signals).
  axis_rotation_max_deg: 0.0
  axis_rotation_prob: 0.0
  per_view_axis_rotation: true
  max_time_warp: 0.0
  scaling: [0.98, 1.02]
  gaussian_noise_std: 0.005
  # These are strong in this codebase because they always apply when >0:
  # - max_mask_duration always masks a segment each call
  # - mask_prob masks channels independently each call
  mask_prob: 0.0
  channel_mask_apply_prob: 1.0
  max_mask_duration: 0
  time_mask_apply_prob: 1.0
  wandering_max_amplitude: 0.0
  wandering_frequency_range: [0.0, 0.0]
  is_submission: false
