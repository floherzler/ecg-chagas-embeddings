# Analysis run registry for the embeddings probe pipeline.
#
# Edit this file by experiment name and later paste your final checkpoint paths
# (local `.ckpt` paths or `wandb:<entity>/<project>/<artifact>:<alias>` URIs).
#
# The pipeline assumes a held-out test fold `fold=4` and uses that fold for:
# - full-test evaluation
# - probe sampling (all positives + 2× negatives)
#
# Global defaults (can be overridden per run by setting `data_dir`).
